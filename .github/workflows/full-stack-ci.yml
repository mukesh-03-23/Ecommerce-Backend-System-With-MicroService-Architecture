name: Full stack CI
on:
  push:
    branches: [feat/full-stack-audit-and-frontend-2026]
  pull_request:

jobs:
  java:
    name: Java ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, eureka-service, user-service, product-service, cart-service, order-service, PaymentService, Notification-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml
      - name: Compile and package (without external-service context tests)
        run: mvn -B -ntp -f "${{ matrix.service }}/pom.xml" -DskipTests package
      - name: Run deterministic regression tests
        run: mvn -B -ntp -f "${{ matrix.service }}/pom.xml" -Dtest='*RegressionTest' -Dsurefire.failIfNoSpecifiedTests=false test

  frontend:
    name: Frontend lint, types and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build
