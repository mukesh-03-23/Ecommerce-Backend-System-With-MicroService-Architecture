<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Order</title>

    ```
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f5f5f5;
            margin: 0;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,.2);
            text-align: center;
            width: 500px;
        }

        h2 {
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 140px;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 5px;
            resize: vertical;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: white;
        }

        button:hover {
            background: #0056b3;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
    ```

</head>

<body>

<div class="card">

    ```
    <h2>Place Order</h2>

    <textarea
            id="token"
            placeholder="Paste your JWT token here..."></textarea>

    <br>

    <button id="placeOrderButton" onclick="placeOrder()">
        Place Order
    </button>

    <div id="message"></div>
    ```

</div>

<script>

    async function placeOrder() {

        const token = document.getElementById("token").value.trim();
        const button = document.getElementById("placeOrderButton");
        const message = document.getElementById("message");

        if (token === "") {
            alert("Please enter a JWT token.");
            return;
        }

        button.disabled = true;
        button.innerText = "Creating Order...";
        message.innerText = "";

        try {

            /*
             * Send ONLY JWT.
             *
             * No JSON body.
             * No Content-Type header.
             */
            const response = await fetch(
                "http://localhost:8080/order/placeorder",
                {
                    method: "POST",

                    headers: {
                        "Authorization": "Bearer " + token
                    }
                }
            );

            /*
             * Read backend response
             */
            const responseText = await response.text();

            console.log("Backend response:", responseText);

            if (!response.ok) {

                console.error(
                    "Place Order Failed:",
                    response.status,
                    responseText
                );

                alert(
                    "Request Failed (" +
                    response.status +
                    "): " +
                    responseText
                );

                button.disabled = false;
                button.innerText = "Place Order";

                return;
            }

            /*
             * Convert response text into JSON
             */
            const data = JSON.parse(responseText);

            console.log("Complete Order Response:", data);

            /*
             * Check whether Razorpay payment information
             * was returned by Payment Service.
             */
            if (!data.paymentorderresponse) {

                console.error(
                    "Payment information missing:",
                    data
                );

                alert(
                    "Order was created, but Razorpay payment information was not returned."
                );

                button.disabled = false;
                button.innerText = "Place Order";

                return;
            }

            /*
             * Save complete payment information.
             */
            sessionStorage.setItem(
                "paymentData",
                JSON.stringify(data.paymentorderresponse)
            );

            /*
             * Save order information as well.
             */
            if (data.orderResponse) {

                sessionStorage.setItem(
                    "orderData",
                    JSON.stringify(data.orderResponse)
                );
            }

            console.log(
                "Payment Data:",
                data.paymentorderresponse
            );

            console.log(
                "Order Data:",
                data.orderResponse
            );

            /*
             * Go to payment page.
             *
             * payment.html should read paymentData
             * and open Razorpay Checkout.
             */
            window.location.href = "payment.html";

        } catch (error) {

            console.error(
                "Place Order Error:",
                error
            );

            alert(
                "Unable to connect to API Gateway."
            );

            button.disabled = false;
            button.innerText = "Place Order";
        }
    }

</script>

</body>
</html>
