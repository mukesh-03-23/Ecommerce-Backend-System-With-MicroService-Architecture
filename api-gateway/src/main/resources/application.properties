spring.application.name=api-gateway
server.port=8080
spring.cloud.gateway.server.webmvc.routes[0].id=product-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/product/**

spring.cloud.gateway.server.webmvc.routes[1].id=order-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://ORDER-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/order/**

spring.cloud.gateway.server.webmvc.routes[2].id=user-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/user/**

spring.cloud.gateway.server.webmvc.routes[3].id=cart-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://CART-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/cart/**

spring.cloud.gateway.server.webmvc.routes[4].id=payment-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/payments/**


jwt.secret=${JWTSECRET}
jwt.expiration=3600000
logging.level.org.springframework.cloud.gateway=TRACE   
logging.level.org.springframework.web.servlet=TRACE